name: CI
on:
  push:
    branches: [main, staging]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - run: pnpm --filter @partygame/web exec playwright install --with-deps chromium
      - run: pnpm e2e
        env:
          CI: 'true'

  # Deploys only after every check and e2e test has passed: main → production, staging → staging.
  # Needs a CLOUDFLARE_API_TOKEN repository secret (the "Edit Cloudflare Workers" token template);
  # without it this job skips the deploy instead of failing.
  deploy:
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency: deploy-${{ github.ref_name }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build and deploy
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN is not set, so nothing was deployed."
            exit 0
          fi
          if [ "$GITHUB_REF_NAME" = "staging" ]; then export CLOUDFLARE_ENV=staging; fi
          pnpm build
          cd apps/web && npx wrangler deploy
